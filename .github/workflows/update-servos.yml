name: Update servos

on:
  schedule:
    - cron: "17 16 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download servos
        run: node build-servos.mjs
      - name: Save if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain -- servos.json servos-meta.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add servos.json servos-meta.json
            git commit -m "Update servo data"
            git push
            gh api --method POST "/repos/${{ github.repository }}/pages/builds" || true
          else
            echo "No changes"
          fi
